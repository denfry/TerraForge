# ===========================================================================
#  TerraForge - Real Earth Engine
#  Every option here is honoured by the runtime. See docs/configuration.md.
# ===========================================================================

world:
  # Name of the Minecraft world generated by TerraForge.
  name: earth

scale:
  # Horizontal scale. 1.0 => one block covers one kilometre of ground.
  # Supported presets: 0.5 (1 block = 2 km), 1.0, 2.0 (1 block = 500 m), 5.0 (1 block = 200 m).
  blocks-per-km: 1.0

earth:
  # Geographic point that maps to Minecraft x=0, z=0.
  # Default: centre of the central-europe test region.
  origin:
    latitude: 51.0
    longitude: 10.0

  # web_mercator     - conformal, shapes correct, distances stretched by 1/cos(lat), poles clipped
  # equirectangular  - exact north-south distance, standard parallel = origin latitude (recommended
  #                    for regional worlds)
  # plate_carree     - equirectangular with the standard parallel at the equator
  projection: equirectangular

terrain:
  sea-level: 63
  min-y: -64
  max-y: 320

  # Real elevation is multiplied by this before being converted to Y.
  # Supported: 0.5, 1.0, 1.5, 2.0, 3.0
  vertical-exaggeration: 1.0

  # Vertical metres represented by one block. 1.0 keeps "1 block = 1 metre".
  # Raise it when using a large vertical-exaggeration so mountains still fit the world height.
  meters-per-block: 1.0

  # Elevation used when no DEM tile covers a point (metres).
  fallback-elevation: 0.0

  bedrock-thickness: 8

water:
  oceans: true
  lakes: true
  rivers: true
  # Ocean depth in metres where the DEM provides no bathymetry.
  default-ocean-depth: 30.0

biomes:
  enabled: true
  # Dithering applied at biome borders so class edges are not pixelated. 0 disables it.
  edge-noise: 0.35

vegetation:
  enabled: true
  # Multiplier on natural vegetation density (trees, grass, flowers).
  density: 1.0

generation:
  # Natural terrain only: no player infrastructure is generated.
  # Strongly recommended - players and Towny provide all infrastructure.
  natural-only: true
  # Generated cave geometry is constrained by prepared WOKAM karst polygons and may be anchored
  # at prepared OSM natural=cave_entrance points. It is not a survey of real 3D cave geometry.
  caves: false
  # Vanilla's structure pass mixes natural and man-made structures; leave this off to prevent
  # villages, temples, mineshafts, strongholds and other human-made generation.
  man-made-structures: false
  worker-threads: 4

pregeneration:
  # Never permit an unbounded async queue; one chunk is the safe default.
  max-in-flight: 1
  pause-when-players-online: true
  minimum-tps: 18.0
  maximum-mspt: 40.0
  stable-resume-seconds: 15
  minimum-free-disk-gb: 10
  checkpoint-every-chunks: 128

# Hard switches for man-made features. TerraForge has no code path that builds them;
# these must all stay false or the plugin refuses to start.
infrastructure:
  roads: false
  buildings: false
  railways: false
  bridges: false
  airports: false
  power-lines: false

data:
  # Paths are relative to plugins/TerraForge/
  data-directory: data
  cache-directory: cache
  database-file: terraforge.db

cache:
  memory-limit-mb: 1024
  dem-tile-cache-entries: 256
  # Prepared land-cover grids kept resident. Grids are read on demand, so a planet-wide
  # import costs no more memory than a regional one -- only more files on disk.
  landcover-grid-cache-entries: 256
  chunk-cache-entries: 4096
  statistics-interval-seconds: 300

towny:
  # Soft dependency: ignored when Towny is not installed.
  enabled: true

bluemap:
  # Soft dependency: ignored when BlueMap is not installed.
  enabled: true
  city-markers: true
  country-labels: true

debug:
  enabled: false
  # Allow players with terraforge.command.debug to toggle their own overlay.
  per-player: false

# Bounded region used for development and validation before scaling to the planet.
test-region:
  name: central-europe
  latitude-min: 47.0
  latitude-max: 55.5
  longitude-min: 5.0
  longitude-max: 15.5
