# ===========================================================================
#  TerraForge - Real Earth Engine
#  Every option here is honoured by the runtime. See docs/configuration.md.
# ===========================================================================

world:
  # Name of the Minecraft world generated by TerraForge.
  name: earth

scale:
  # Horizontal scale. 1.0 => one block covers one kilometre of ground.
  # Supported presets: 0.5 (1 block = 2 km), 1.0, 2.0 (1 block = 500 m), 5.0 (1 block = 200 m).
  blocks-per-km: 1.0

earth:
  # Geographic point that maps to Minecraft x=0, z=0.
  # Default: centre of the central-europe test region.
  origin:
    latitude: 51.0
    longitude: 10.0

  # web_mercator     - conformal, shapes correct, distances stretched by 1/cos(lat), poles clipped
  # equirectangular  - exact north-south distance, standard parallel = origin latitude (recommended
  #                    for regional worlds)
  # plate_carree     - equirectangular with the standard parallel at the equator
  projection: equirectangular

terrain:
  sea-level: 63
  min-y: -64
  max-y: 320

  # Real elevation is multiplied by this before being converted to Y.
  # Supported: 0.5, 1.0, 1.5, 2.0, 3.0
  vertical-exaggeration: 1.0

  # Vertical metres represented by one block. 1.0 keeps "1 block = 1 metre".
  # Raise it when using a large vertical-exaggeration so mountains still fit the world height.
  meters-per-block: 1.0

  # Elevation used when no DEM tile covers a point (metres).
  fallback-elevation: 0.0

  bedrock-thickness: 8

  # Width, in blocks, of the ground each column's height is averaged over. 1.0 reads exactly the
  # block's own footprint; 3.0 averages a 3x3-block window centred on the column -- a deterministic
  # box filter over the height field, seamless across chunks, and the difference between walkable
  # ground and one-block noise at a kilometre per block. Raise to 5.0 for gentler terrain still.
  smoothing: 3.0

water:
  oceans: true
  lakes: true
  rivers: true
  # Ocean depth in metres where the DEM provides no bathymetry.
  default-ocean-depth: 30.0
  # HydroRIVERS discharge (m^3/s) below which a prepared river is not carved. Preparation keeps every
  # mapped river, including the smallest headwaters -- this only decides what the current world
  # renders, so raising it needs no re-preparation. At 1.0 the whole connected network renders, which
  # at coarse blocks-per-km settings can look like a dense, hairy web rather than distinct rivers;
  # raise it to thin the network out. 0 renders every prepared line.
  min-visible-river-discharge-cms: 1.0
  # Depth floors, in blocks. A water body is never shallower than this whatever its real depth
  # rounds to at this vertical scale: at 20 m per block a 6 m lake or a 30 m default ocean would
  # otherwise be a single block of water over a flat floor. Beds vary smoothly between the floor
  # and twice it, so a lake has a deep middle rather than a flat bottom.
  min-lake-depth-blocks: 3
  min-river-depth-blocks: 2
  min-ocean-depth-blocks: 6
  # How far a shore's influence reaches, in blocks. Banks climb at most one block per block for
  # this far from the water, and beds shelve out one block per block for this far from the land,
  # so a lake is a basin with sloping banks rather than a slab in a pit. 0 leaves shores as the
  # data has them. Each chunk samples a margin this wide, so the cost grows with it.
  shore-blend-blocks: 4

biomes:
  enabled: true
  # Dithering applied at biome borders so class edges are not pixelated. 0 disables it.
  edge-noise: 0.35

generation:
  # Natural terrain only: no player infrastructure is generated.
  # Strongly recommended - players and Towny provide all infrastructure.
  natural-only: true

  # TerraForge's own cave geometry, constrained by prepared WOKAM karst polygons and anchored at
  # prepared OSM natural=cave_entrance points. It is not a survey of real 3D cave geometry.
  # This switch drives TerraForge's carver and nothing else.
  caves: false

  # Hand each chunk to vanilla's cave/canyon carvers and its aquifer as well.
  #
  # Leave this off unless this world's vertical frame IS vanilla's (sea-level 63, min-y -64,
  # meters-per-block 1.0). Those stages read vanilla's frame, not terrain.* -- so at 20 m per block
  # a routine 30-block cave removes 600 m of real rock, vanilla's carvers are permitted to replace
  # water (they breach the seabed instead of running under it), and the aquifer then floods whatever
  # they carved below y=63 with water, or below y=-54 with lava.
  vanilla-caves: false

  # Hand each chunk to vanilla's decoration pass. All of it or none of it: trees, grass and flowers
  # arrive together with ore veins, spring_water, spring_lava, lake_lava, kelp and seagrass, at
  # vanilla's density. At coarse blocks-per-km a "tree" is kilometres across and a lava spring lands
  # at altitude, which is why this is off by default.
  vanilla-decorations: false

  # Vanilla's structure pass mixes natural and man-made structures; leave this off to prevent
  # villages, temples, mineshafts, strongholds and other human-made generation.
  man-made-structures: false
  worker-threads: 4

  # TerraForge's own vegetation: trees, grass, ferns, flowers, dead bushes and cacti placed from
  # real land cover (how much grows) and climate (what grows), in this world's vertical frame and
  # without any of the ore veins, lava lakes or springs that vanilla-decorations would bring.
  # Deterministic per chunk: the same data and config grow the same forests on any server.
  vegetation:
    enabled: true
    # Multiplier on every placement probability. 1.0 is calibrated to vanilla's forest density.
    density: 1.0
    # TerraForge's own procedural trees next to vanilla's: willows on river banks, palms on warm
    # coasts, baobabs on the savanna, tall pines in the taiga, dead trees on the steppe, fallen logs.
    custom-trees: true
    # Flat cropland becomes tilled fields: wheat, carrots, potatoes, beetroot, pumpkins and melons in
    # one-crop plots with irrigation channels. Sloping cropland stays meadow.
    farmland: true

pregeneration:
  # Never permit an unbounded async queue; one chunk is the safe default.
  max-in-flight: 1
  pause-when-players-online: true
  minimum-tps: 18.0
  maximum-mspt: 40.0
  stable-resume-seconds: 15
  minimum-free-disk-gb: 10
  checkpoint-every-chunks: 128

# Hard switches for man-made features. TerraForge has no code path that builds them;
# these must all stay false or the plugin refuses to start.
infrastructure:
  roads: false
  buildings: false
  railways: false
  bridges: false
  airports: false
  power-lines: false

data:
  # Paths are relative to plugins/TerraForge/
  data-directory: data
  cache-directory: cache
  database-file: terraforge.db

cache:
  memory-limit-mb: 1024
  dem-tile-cache-entries: 256
  # Prepared land-cover grids kept resident. Grids are read on demand, so a planet-wide
  # import costs no more memory than a regional one -- only more files on disk.
  landcover-grid-cache-entries: 256
  # Decoded natural-water geometries kept resident. Geometry is decoded from the prepared
  # database on demand, so a planet-wide import costs no more memory than a regional one.
  water-feature-cache-entries: 4096
  chunk-cache-entries: 4096
  statistics-interval-seconds: 300

towny:
  # Soft dependency: ignored when Towny is not installed.
  enabled: true

bluemap:
  # Soft dependency: ignored when BlueMap is not installed.
  enabled: true
  city-markers: true
  country-labels: true
  # Upper bound on non-capital city markers published to the map. Capitals are always kept.
  # A dense gazetteer can have tens of thousands of places; publishing all of them floods the
  # web map with markers and makes the browser lag. Lower this if the map still feels heavy.
  max-city-markers: 300
  # Smallest population a non-capital city needs to get a marker. Raise this to drop small towns
  # and villages (including entries with unknown/zero population) from the map.
  min-city-population: 5000

debug:
  enabled: false
  # Allow players with terraforge.command.debug to toggle their own overlay.
  per-player: false

# Bounded region used for development and validation before scaling to the planet.
test-region:
  name: central-europe
  latitude-min: 47.0
  latitude-max: 55.5
  longitude-min: 5.0
  longitude-max: 15.5
