name: TerraForge
version: '${version}'
main: dev.terraforge.plugin.TerraForgePlugin
api-version: '${apiVersion}'
description: Real Earth terrain engine -- natural geography only, no man-made infrastructure.
author: TerraForge
website: https://github.com/denfry/TerraForge
folia-supported: false

# The default world's generator is resolved during server startup, before plugins normally
# enable -- without STARTUP load order, Bukkit calls getDefaultWorldGenerator() too early and
# 'earth' silently falls back to vanilla terrain.
load: STARTUP

softdepend:
  - Towny
  - NewTowny
  - BlueMap

# The earth command (and its tf/terraforge aliases) is registered dynamically at runtime via
# JavaPlugin#registerCommand, not declared here: Paper's BasicCommand routing lets each feature
# family (geographic, world, and later pregenerate/data/doctor/performance) enforce its own
# permission node instead of one static usage string.

permissions:
  terraforge.admin:
    description: Full access to every TerraForge command.
    default: op
    children:
      terraforge.command.info: true
      terraforge.command.location: true
      terraforge.command.teleport: true
      terraforge.command.debug: true
      terraforge.command.cache: true
      terraforge.command.pregenerate: true
      terraforge.command.towny: true
      terraforge.command.reload: true
      terraforge.command.world: true
      terraforge.command.data: true
      terraforge.command.doctor: true
      terraforge.command.performance: true

  terraforge.command.info:
    description: View world and projection information.
    default: true
  terraforge.command.location:
    description: Query your own geographic location (/earth whereami, /earth coords).
    default: true
  terraforge.command.teleport:
    description: Teleport by coordinates, country or city.
    default: op
  terraforge.command.debug:
    description: Toggle the debug overlay.
    default: op
  terraforge.command.cache:
    description: Inspect and clear caches.
    default: op
  terraforge.command.pregenerate:
    description: Start region pregeneration.
    default: op
  terraforge.command.towny:
    description: Re-annotate existing Towny towns with geography.
    default: op
  terraforge.command.reload:
    description: Reload terraforge.yml.
    default: op
  terraforge.command.world:
    description: Plan, stage, verify and abort the managed Earth world (/earth world ...).
    default: op
  terraforge.command.data:
    description: Report prepared DEM data inventory (/earth data status).
    default: op
  terraforge.command.doctor:
    description: Run TerraForge diagnostics (/earth doctor).
    default: op
  terraforge.command.performance:
    description: Report live server and pregeneration performance (/earth performance).
    default: op
