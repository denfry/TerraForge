name: Release

# Tag-driven: pushing v1.2.3 builds that commit and publishes the jars against it.
# Nothing here decides the version -- gradle.properties does, and the tag must agree with it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Check the tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(./gradlew -q properties --no-daemon | awk '/^version:/ {print $2}')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match gradle.properties version $version." >&2
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Extract the release notes for this version
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" version "\\]" { printing = 1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}." >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            terraforge-plugin/build/libs/TerraForge-*.jar
            terraforge-cli/build/libs/terraforge-cli-*.jar
