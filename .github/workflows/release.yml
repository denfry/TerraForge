name: Release

# Tag-driven: pushing v1.2.3 builds that commit and publishes the jars against it.
# gradle.properties remains the single source of truth, and the tag must match it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          cache-read-only: true

      - name: Check release metadata
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a supported semantic version." >&2
            exit 1
          fi

          tag="${GITHUB_REF_NAME#v}"
          version="$(./gradlew -q properties --no-daemon | awk '/^version:/ {print $2}')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match gradle.properties version $version." >&2
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Collect release artifacts
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp "terraforge-plugin/build/libs/TerraForge-${version}.jar" dist/
          cp "terraforge-cli/build/libs/terraforge-cli-${version}.jar" dist/
          (
            cd dist
            sha256sum ./*.jar > SHA256SUMS
          )

      - name: Extract release notes
        shell: bash
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" version "\\]" { printing = 1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}." >&2
            exit 1
          fi

      - name: Publish plugin to Modrinth
        # Soft-fails until MODRINTH_TOKEN/MODRINTH_PROJECT_ID are configured, so a missing
        # one-time setup does not block the GitHub release below.
        continue-on-error: true
        run: ./gradlew :terraforge-plugin:modrinth --no-daemon --stacktrace
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/TerraForge-*.jar
            dist/terraforge-cli-*.jar
            dist/SHA256SUMS
