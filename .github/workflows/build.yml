name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build and test
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: terraforge-plugin-${{ github.sha }}
          path: terraforge-plugin/build/libs/TerraForge-*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: terraforge-cli-${{ github.sha }}
          path: terraforge-cli/build/libs/terraforge-cli-*.jar
          if-no-files-found: error
