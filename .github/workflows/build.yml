name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

  build:
    name: Build and test
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Collect distributable jars
        shell: bash
        run: |
          version="$(./gradlew -q properties --no-daemon | awk '/^version:/ {print $2}')"
          mkdir -p dist
          cp "terraforge-plugin/build/libs/TerraForge-${version}.jar" dist/
          cp "terraforge-cli/build/libs/terraforge-cli-${version}.jar" dist/

      - name: Upload plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraforge-plugin-${{ github.sha }}
          path: dist/TerraForge-*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraforge-cli-${{ github.sha }}
          path: dist/terraforge-cli-*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
