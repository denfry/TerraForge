name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

  build:
    name: Build and test
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Collect distributable jars
        shell: bash
        run: |
          version="$(./gradlew -q properties --no-daemon | awk '/^version:/ {print $2}')"
          mkdir -p dist
          cp "terraforge-plugin/build/libs/TerraForge-${version}.jar" dist/
          cp "terraforge-cli/build/libs/terraforge-cli-${version}.jar" dist/

      - name: Upload plugin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraforge-plugin-${{ github.sha }}
          path: dist/TerraForge-*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload CLI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraforge-cli-${{ github.sha }}
          path: dist/terraforge-cli-*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
