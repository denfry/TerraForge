# ---------------------------------------------------------------------------
# TerraForge -- build-wide properties.
# Minecraft/Paper versions live ONLY here (see docs/development.md).
# ---------------------------------------------------------------------------

group=dev.terraforge
version=0.1.0

# --- Target platform -------------------------------------------------------
minecraft_version=1.21.8
paper_version=1.21.8-R0.1-SNAPSHOT
java_version=21

# --- Third-party integrations (compileOnly + softdepend) -------------------
towny_version=0.103.1.1
# 2.8.0 targets JVM 22; 2.7.8 is the newest release that runs on Java 21.
bluemap_api_version=2.7.8

# --- Libraries -------------------------------------------------------------
jts_version=1.20.0
sqlite_version=3.53.2.1
hikaricp_version=7.1.0
jackson_version=2.22.1
picocli_version=4.7.7
imageio_version=3.14.0
caffeine_version=3.2.4

# --- Test / bench ----------------------------------------------------------
junit_version=6.1.2
mockito_version=5.23.0
assertj_version=3.27.6
jmh_version=1.37

# --- Gradle ----------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
